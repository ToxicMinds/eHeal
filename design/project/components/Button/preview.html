<!-- @dsCard group="Actions" height=170 subtitle="Primary, secondary, quiet, danger; busy and disabled" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>.demo { display: grid; gap: 16px; padding: 24px; }</style>
</head>
<body>
<div class="demo">
  <div class="wa-actions">
    <button class="wa-button wa-button--primary" type="button">Start transcription</button>
    <button class="wa-button wa-button--secondary" type="button">Cancel</button>
    <button class="wa-button wa-button--quiet" type="button">Show details</button>
    <button class="wa-button wa-button--danger" type="button"><svg class="wa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Remove patient audio</button>
  </div>
  <div class="wa-actions">
    <button class="wa-button wa-button--primary" type="button" aria-busy="true">Creating…</button>
    <button class="wa-button wa-button--primary" type="button" disabled>Start transcription</button>
    <p class="wa-hint">Attach the patient track first.</p>
  </div>
</div>
</body>
</html>
