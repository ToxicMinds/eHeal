<!-- @dsCard group="Forms" height=470 subtitle="Reference with prefix, error, date and language, notes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field</title>
<style>.demo { padding: 24px; max-width: 620px; }</style>
</head>
<body>
<div class="demo wa-form">
  <div class="wa-fields-row">
    <div class="wa-field">
      <label class="wa-label" for="ref">Patient reference</label>
      <p class="wa-hint" id="ref-hint">Digits only.</p>
      <div class="wa-affixed"><span class="wa-affix" aria-hidden="true">SYN-</span><input class="wa-input" id="ref" inputmode="numeric" value="0042" aria-describedby="ref-hint"></div>
    </div>
    <div class="wa-field">
      <label class="wa-label" for="ref-bad">Patient reference</label>
      <p class="wa-hint" id="ref-bad-hint">Digits only.</p>
      <div class="wa-affixed"><span class="wa-affix" aria-hidden="true">SYN-</span><input class="wa-input" id="ref-bad" value="Anna" aria-invalid="true" aria-describedby="ref-bad-hint ref-bad-error"></div>
      <p class="wa-error" id="ref-bad-error"><svg class="wa-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>Use digits only, for example 0042.</p>
    </div>
  </div>
  <div class="wa-fields-row">
    <div class="wa-field">
      <label class="wa-label" for="when">Date and time</label>
      <input class="wa-input" id="when" type="datetime-local" value="2026-10-14T09:30">
    </div>
    <div class="wa-field">
      <label class="wa-label" for="lang">Language spoken</label>
      <div class="wa-select"><select id="lang"><option>English</option><option>German</option><option>Slovak</option><option>Mixed or unsure</option></select></div>
    </div>
  </div>
  <div class="wa-field">
    <label class="wa-label" for="notes">Notes</label>
    <p class="wa-hint" id="notes-hint">For example "sleep complaint, patient mentions a supplement".</p>
    <textarea class="wa-textarea" id="notes" aria-describedby="notes-hint"></textarea>
  </div>
</div>
</body>
</html>
