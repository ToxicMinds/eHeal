<!-- @dsCard group="Screens" page width=1280 height=820 subtitle="Sign-in, desktop" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<div>
<main class="wa-night">
  <div class="wa-door">
    <header class="wa-door__head">
      <span class="wa-wordmark">Watson</span>
      <h1 class="wa-door__title">Every doctor deserves a&nbsp;Watson.</h1>
      <p class="wa-door__lead">You see the patient. Watson does the paperwork.</p>
    </header>
    <section class="wa-panel wa-door__card" aria-labelledby="signin-title">
      <h2 class="wa-heading" id="signin-title">Sign in</h2>
      <p class="wa-hint">Accounts are made by the project owner. There is no public sign-up.</p>
      <div class="wa-field"><label class="wa-label" for="name">Name</label><input class="wa-input" id="name" autocomplete="username" value="robin"></div>
      <div class="wa-field"><label class="wa-label" for="password">Password</label><input class="wa-input" id="password" type="password" autocomplete="current-password" value="••••••••••••"></div>
      <button class="wa-button wa-button--primary" type="button">Sign in</button>
    </section>
    <figure class="wa-notebook">
      <figcaption class="wa-notebook__title">From Watson's notebook</figcaption>
      <ol>
        <li><time>08:12</time><span>Booked for 09:30 and paid, €40.00</span></li>
        <li><time>09:30</time><span>Video call with the patient, 32 minutes</span></li>
        <li><time>10:03</time><span>Notes written: every word, both voices</span></li>
        <li><time>10:06</time><span>Your form filled in: 18 of 21 answers, each with its quote</span></li>
        <li class="is-now"><time>Now</time><span>Waiting for you to check and approve</span></li>
      </ol>
    </figure>
  </div>
</main>
</div>
</body>
</html>
