<!-- @dsCard group="Status" height=130 subtitle="Every phase-1 consultation status" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusChip</title>
<style>.demo { display: flex; flex-wrap: wrap; gap: 12px; padding: 24px; }</style>
</head>
<body>
<div class="demo">
  <span class="wa-chip"><svg class="wa-icon wa-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Waiting for consent</span>
  <span class="wa-chip wa-chip--current"><svg class="wa-icon wa-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Waiting for audio</span>
  <span class="wa-chip wa-chip--current"><svg class="wa-icon wa-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Ready to transcribe</span>
  <span class="wa-chip wa-chip--current"><svg class="wa-icon wa-icon--sm wa-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>Transcribing</span>
  <span class="wa-chip wa-chip--attention"><svg class="wa-icon wa-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>Transcript ready to review</span>
  <span class="wa-chip wa-chip--failed"><svg class="wa-icon wa-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>Transcription failed</span>
  <span class="wa-chip wa-chip--done"><svg class="wa-icon wa-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Transcript reviewed</span>
</div>
</body>
</html>
