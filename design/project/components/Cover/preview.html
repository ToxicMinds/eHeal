<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eHeal</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-text); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .prac { fill: var(--practitioner); }
  .pat { fill: var(--patient); }
  .tur { fill: var(--turmeric); }
  .deep { fill: var(--ink); }
  .tint { fill: var(--practitioner-tint); }
  .idle { fill: var(--rule); }
  .line { fill: var(--ink); }
  .blk, .pill { rx: var(--radius-paper); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font: 600 120px/0.9 var(--font-display); letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      practitioner 112x208 bled off the top · ink 112x56 under it · patient 96x168 · turmeric 48x40 once (it only marks doubt) · practitioner-tint 240x240 bled off the right, the sheet the motif sits on: about 36% of 960x288
        arrangement two voice slabs and one tint sheet, bottoms on one line space-6 above the edge, space-4 gutters
        pattern     two rails, from "Signature: two rails": idle rule rails lit per turn in patient or practitioner (both for the overlap), ink line pills at a space-4 pitch, one turmeric pill for the uncertain word
        scales      sides in space-2 multiples; gutters space-4; line pitch space-4; pills space-2 tall with rx radius-paper (half of space-2); blocks radius-paper
      -->
      <rect class="prac blk" x="16" y="-16" width="112" height="208" rx="4"/>
      <rect class="deep blk" x="16" y="208" width="112" height="56" rx="4"/>
      <rect class="tur blk" x="144" y="40" width="48" height="40" rx="4"/>
      <rect class="pat blk" x="144" y="96" width="96" height="168" rx="4"/>
      <rect class="tint blk" x="256" y="24" width="240" height="240" rx="4"/>
      <rect class="idle pill" x="272" y="40" width="4" height="200" rx="2"/>
      <rect class="idle pill" x="280" y="40" width="4" height="200" rx="2"/>
      <rect class="prac pill" x="280" y="44" width="4" height="16" rx="2"/>
      <rect class="pat pill" x="272" y="68" width="4" height="32" rx="2"/>
      <rect class="prac pill" x="280" y="108" width="4" height="16" rx="2"/>
      <rect class="pat pill" x="272" y="132" width="4" height="32" rx="2"/>
      <rect class="pat pill" x="272" y="172" width="4" height="16" rx="2"/>
      <rect class="prac pill" x="280" y="172" width="4" height="16" rx="2"/>
      <rect class="prac pill" x="280" y="196" width="4" height="32" rx="2"/>
      <rect class="line pill" x="296" y="48" width="128" height="8" rx="4"/>
      <rect class="line pill" x="296" y="72" width="152" height="8" rx="4"/>
      <rect class="line pill" x="296" y="88" width="96" height="8" rx="4"/>
      <rect class="line pill" x="296" y="112" width="112" height="8" rx="4"/>
      <rect class="line pill" x="296" y="136" width="72" height="8" rx="4"/>
      <rect class="tur pill" x="376" y="136" width="48" height="8" rx="4"/>
      <rect class="line pill" x="432" y="136" width="40" height="8" rx="4"/>
      <rect class="line pill" x="296" y="152" width="120" height="8" rx="4"/>
      <rect class="line pill" x="296" y="176" width="136" height="8" rx="4"/>
      <rect class="line pill" x="296" y="200" width="152" height="8" rx="4"/>
      <rect class="line pill" x="296" y="216" width="64" height="8" rx="4"/>
    </svg>
  </div>
  <div class="words">
    <p class="name">eHeal</p>
    <p class="tag">Two voices kept apart. Every uncertain word marked.</p>
  </div>
</div>
</body>
</html>
